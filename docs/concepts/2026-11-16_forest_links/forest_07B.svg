<text x="105" y="854" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">出口：E1→03上层新增竖口　E2→04待建上层　E3→08东侧·二段跳</text>
<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：先沿裂壁有控制地下落，再穿根脊攀至东岸；主奖励R不要求二段跳。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径G：东岸放下横桥回E1，之后去R/04无需重做谷底跑酷。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：东岸回廊再抬高160px到E3，让旧入口和08发生新的跨区联系。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">容错：三条横向兜底台分层接住坠落；谷底能原路分段攀回，没有无能力死井。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
