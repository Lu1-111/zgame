<text x="105" y="854" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">出口：E1→03上层新增竖口　E2→04待建上层　E3→08东侧·二段跳</text>
<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：沿巨根外缘分三段攀升，中段A是安全歇脚点；主奖励R在E2前。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径G：到达中段可从背面放下根桥；失误后从下方兜底台快速回中段。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：主奖励后跨160px高冠口到E3，成为03到08的区域高架路。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">容错：上段掉落落入下环而非入口；不靠移动平台、冲刺或技能维持主路。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
</g>
