<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：下闸A放干中渠，沿根井抵达上闸B，再排水接通E2/E3。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径G：到达B后打开干渠底门；01与02之间可走低层直廊，跳过控制井。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：跨160px高根脊直上B背后，回访时绕过闸门操作；奖励R不锁主路。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">复位：两闸旁均能复位，落水进可走底渠；水位不封死E1退路。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
