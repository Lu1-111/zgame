<text x="105" y="854" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">出口：E1→03下层新增侧口　E2→06东侧　E3→04待建下层</text>
<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：哨所斜坡下到围场；两处宽场分开清理藤鞭花掩护与苔甲卫。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径：抵东哨先拉栅门连上层走廊，03↔04未来通行不用穿围场。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：围场高瞭望台接上廊，既是回访捷径也能看到下层藏箱。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">战斗：各场至少保留一个无坑后撤方向；E2为06解谜区的替代入口。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
