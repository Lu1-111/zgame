<text x="105" y="854" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">出口：E1→02下层新增侧口　E2→03中层新增侧口　E3→09西侧</text>
<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：A选支管→B开回流→C调排风，依三片风叶的可见转动判断通断。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径G：三阀到位抬起中层挡板，E1直通E2；以后不重复解谜。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：越过回流腔上沿的根台，连接上层管廊，回访可横穿。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">复位：失误只停风、不扣血；每阀可回初始档，下检修道始终通往入口。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
