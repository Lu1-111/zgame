<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：西下厅清近战群→宽阶上东厅打远近组合→东侧落回出口层。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径：第二厅前先从背面开下廊门，复战可从S直达东厅准备区。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：东厅观战台连接E3，与07共同形成树冠跨区环；不能越未清封印。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">战斗：只有两层宽厅与中间短阶；柱子切远程射线，近战平地不布跳跃坑。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
