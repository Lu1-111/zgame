<text x="105" y="854" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">出口：E1→02中层新增侧口　E2→05东侧　E3→07上层·二段跳</text>
<text x="70" y="903" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">初访：三块宽平地分别安排近战、近远配合、苔甲卫；连接廊留补给空隙。</text>
<text x="70" y="943" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">捷径：清场后开启上层巡护廊，02↔05回访避开已打过的三庭。</text>
<text x="70" y="983" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">二段跳：第二庭上方高看台接E3；初次封印未解除时不能从看台跳过守门战。</text>
<text x="70" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#253c36" text-anchor="start">战斗：每庭有可后退的平地与一段低台；飞蛾不放在出口或窄井贴脸。</text>
<text x="70" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#253c36" text-anchor="start">灰＝实心　白＝通道　蓝＝薄台　绿线＝初访　赭线＝永久捷径　紫线＝二段跳回访（比例示意）</text>
</g>
