<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>奶宝 · 道具组件 ITM-B01</title>
<style>
:root{color-scheme:dark;--bg:#14121c;--panel:#211d2c;--line:#40374e;--text:#f6edda;--sub:#b3a5c6;--gold:#f9cb7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:30px;margin:5px 0}h2{font-size:17px;margin:0 0 12px}p{margin:4px 0;color:var(--sub)}.kicker{letter-spacing:2px;color:var(--gold);font-size:12px}.badge{border:1px solid var(--line);border-radius:20px;padding:8px 14px;color:var(--gold);white-space:nowrap}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0}.toolbar label{display:flex;align-items:center;gap:7px;color:var(--sub)}button,select{font:inherit;background:#30283d;color:var(--text);border:1px solid #51415f;border-radius:8px;padding:7px 13px;cursor:pointer}button:hover{border-color:var(--gold)}button.active{border-color:var(--gold);background:#4d3a37}input{accent-color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(440px,1.3fr) minmax(340px,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:10px 4px;display:flex;flex-direction:column;align-items:center;background:#2a2335;min-width:0}.card span{font-size:12px}.card small{font-size:10px;color:var(--sub)}canvas{display:block;image-rendering:pixelated;max-width:100%}.card canvas{width:96px;height:96px}.detail{width:100%;height:245px;border-radius:10px;background:#191522}.framebar{display:flex;gap:8px;margin:14px 0}.frame{padding:2px;flex:1}.frame canvas{margin:auto;width:64px;height:64px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.meta{font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.world{margin-top:20px}.world canvas{width:100%;border-radius:10px}.slotrow{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 5px}.slot{border:1px solid #6a577c;background:#30263a;border-radius:2px;width:28px;height:28px;padding:1px}.slot img{width:24px;height:24px;image-rendering:pixelated}.legend{font-size:12px;color:var(--sub)}footer{font-size:12px;color:var(--sub);margin:24px 0}.divider{height:1px;background:var(--line);margin:14px 0}a{color:var(--gold)}@media(max-width:950px){main{padding:16px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,1fr)}header{align-items:start}.badge{display:none}}
</style>
<main><header><div><div class="kicker">NAIBER / GALACTIC JOURNEY · ASSET LAB</div><h1>奶系道具组件</h1><p>12 项物品 + 1 项能力奖励 · 世界动画、快捷栏图标与拾取反馈</p></div><div class="badge">ITM-B01 / v001</div></header>
<div class="toolbar"><button id="play">暂停</button><label>速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedVal">1×</span></label><label>底色 <select id="bg"><option value="#191522">暗紫</option><option value="#16241a">林地</option><option value="#e8ddc4">奶油</option><option value="checker">透明格</option></select></label><label><input id="anchor" type="checkbox" checked>锚点</label><button id="pickup">播放拾取</button><button id="reset">恢复循环</button></div>
<div class="layout"><section class="panel"><div class="row"><h2>道具目录</h2><span class="legend">点击选择 · 四帧循环</span></div><div class="grid" id="grid"></div><div class="divider"></div><div class="legend">24×24 图标 / 28×28 槽位</div><div class="slotrow" id="slots"></div></section>
<section class="panel"><div class="row"><h2 id="name"></h2><span class="kicker" id="phase"></span></div><canvas id="detail" class="detail" width="360" height="245"></canvas><div class="framebar" id="framebar"></div><div class="row"><button id="prev">← 前一帧</button><span id="frameLabel"></span><button id="next">后一帧 →</button></div><div id="meta" class="meta"></div></section></div>
<section class="panel world"><div class="row"><h2>640 像素同屏比例</h2><span class="legend">原尺寸角色参考 · root 始终固定</span></div><canvas id="world" width="640" height="180"></canvas><p class="legend">默认上下浮动 1px；拾取仅向上移动并淡出。碰撞、库存与奖励逻辑由游戏端决定。</p></section>
<footer>RAW 原图保留；每项动画共用同一尺度，仅做整数位移校准。资源可独立预览，尚未接入主游戏。 <a href="manifest.json">来源与锚点清单</a> · <a href="README.md">使用说明</a></footer></main>
<script>
const data=__DATA__;
const $=id=>document.getElementById(id);let selected=0,playing=true,time=0,last=0,rate=1,override=null,pickTime=null,pickStartY=-2;
const images=data.items.map(row=>row.images.map(src=>{let i=new Image();i.src=src;return i}));const actor=new Image();actor.src=data.actor;
let cards=[];for(let i=0;i<data.items.length;i++){const row=data.items[i],b=document.createElement('button');b.className='card';b.innerHTML='<canvas width="96" height="96"></canvas><span>'+row.name+'</span><small>'+row.trackingId+'</small>';b.onclick=()=>select(i);$('grid').append(b);cards.push(b);const slot=document.createElement('button');slot.className='slot';slot.title=row.name;slot.innerHTML='<img alt="'+row.name+'" src="'+row.iconData+'">';slot.onclick=()=>select(i);$('slots').append(slot)}
let thumbs=[];for(let i=0;i<4;i++){const b=document.createElement('button');b.className='frame';b.innerHTML='<canvas width="64" height="64"></canvas><small>0'+(i+1)+'</small>';b.onclick=()=>{override=i;playing=false;$('play').textContent='播放';pickTime=null};$('framebar').append(b);thumbs.push(b)}
function select(i){selected=i;override=null;pickTime=null;cards.forEach((b,j)=>b.classList.toggle('active',j===i));const row=data.items[i];$('name').textContent=row.name;$('meta').innerHTML=row.id+' · '+row.type+'<br>画布 32×32 / root (16,24) / 4 FPS<br>来源 '+row.sourceSize.join('×')+' → 固定尺度 '+row.frames[0].scaleNominal.toFixed(5)+'<br>'+ (row.countsInTwelve?'正式物品清单 12 项之一':'OBJ-06 / ABL-01 · 独立能力奖励');}
function frame(){return override??Math.floor(time*4)%4}
function clear(ctx,w,h){let b=$('bg').value;ctx.imageSmoothingEnabled=false;if(b==='checker'){for(let y=0;y<h;y+=12)for(let x=0;x<w;x+=12){ctx.fillStyle=((x/12+y/12)%2)?'#4a4254':'#352e40';ctx.fillRect(x,y,12,12)}}else{ctx.fillStyle=b;ctx.fillRect(0,0,w,h)}}
function cross(ctx,x,y){ctx.strokeStyle='#ecb669';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-5,y+.5);ctx.lineTo(x+6,y+.5);ctx.moveTo(x+.5,y-5);ctx.lineTo(x+.5,y+6);ctx.stroke()}
function draw(ctx,index,x,y,scale=1,phase=frame(),pickup=false){let alpha=1,dy=-data.defaults.baseLift-Math.sin(time*Math.PI*2/data.defaults.bobPeriod)*data.defaults.bobAmplitude;if(pickup&&pickTime!==null){const p=Math.min(1,pickTime/data.defaults.pickupDuration);dy=pickStartY-data.defaults.pickupRise*(1-Math.pow(1-p,data.defaults.pickupEasePower));alpha=1-p}$('phase').textContent=pickTime===null?'IDLE LOOP':(pickTime>=data.defaults.pickupDuration?'COLLECTED':'PICKUP');ctx.save();ctx.globalAlpha=alpha;if(images[index][phase].complete)ctx.drawImage(images[index][phase],Math.round(x-16*scale),Math.round(y+(dy-24)*scale),32*scale,32*scale);ctx.restore();if($('anchor').checked)cross(ctx,x,y)}
$('play').onclick=()=>{playing=!playing;override=null;$('play').textContent=playing?'暂停':'播放'};$('speed').oninput=e=>{rate=+e.target.value;$('speedVal').textContent=rate+'×'};
$('pickup').onclick=()=>{if(pickTime!==null)return;pickStartY=-data.defaults.baseLift-Math.sin(time*Math.PI*2/data.defaults.bobPeriod)*data.defaults.bobAmplitude;pickTime=0;override=null;playing=true;$('play').textContent='暂停'};$('reset').onclick=()=>{pickTime=null;time=0;override=null;playing=true;$('play').textContent='暂停'};
function step(n){override=(frame()+n+4)%4;playing=false;pickTime=null;$('play').textContent='播放'}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
function tick(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){time+=dt*rate;if(pickTime!==null)pickTime+=dt*rate}const f=frame();for(let i=0;i<cards.length;i++){const c=cards[i].querySelector('canvas'),ctx=c.getContext('2d');clear(ctx,96,96);draw(ctx,i,48,78,3,f,false)}let c=$('detail'),ctx=c.getContext('2d');clear(ctx,c.width,c.height);draw(ctx,selected,180,194,6,f,true);thumbs.forEach((b,i)=>{b.classList.toggle('active',i===f);const ctx=b.querySelector('canvas').getContext('2d');clear(ctx,64,64);if(images[selected][i].complete)ctx.drawImage(images[selected][i],0,0,64,64)});$('frameLabel').textContent=(f+1)+' / 4';c=$('world');ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#16241a';ctx.fillRect(0,0,640,180);ctx.fillStyle='#263b2b';ctx.fillRect(0,133,640,47);ctx.fillStyle='#576444';ctx.fillRect(0,132,640,2);if(actor.complete)ctx.drawImage(actor,150-32,132-58);cross(ctx,150,132);for(let i=0;i<5;i++){const k=(selected+i)%data.items.length;draw(ctx,k,280+i*65,132,1,f,k===selected);ctx.fillStyle='#dcd4bc';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(data.items[k].name,280+i*65,160)}requestAnimationFrame(tick)}select(0);requestAnimationFrame(tick);
</script></html>
